<div id="accordion-add-food" class="rtl text-right farsi">
  <div class="card" id="add-food-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-food"
          aria-expanded="true"
          aria-controls="collapse-add-food"
        >
        افزودن غذا          
        </button>
      </h5>
    </div>
       <div
      id="collapse-add-food"
      class="collapse {% if expand_add_food %} show {% endif %}"
      aria-labelledby="heading-add-food"
      data-parent="#accordion-add-food"
    >
    <div class="card-body">
      <form @submit.prevent="add_food()">
        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label for="">عنوان</label>
              <input v-model="title" type="text" class="form-control" />
            </div>
          </div>
       

          <div class="col-md-4">
            <div class="form-group">
              <label for="exampleInputDate">تاریخ</label>
              <date-picker v-model="event_date"></date-picker>

              <input
                type="text"
                required
                class="form-control"
                v-model="event_date"
              />
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-group">
              <label for="exampleInputDate">زمان</label>

              <input
                type="text"
                required
                class="form-control"
                v-model="event_time"
              />
            </div>
          </div>


          
          <div class="col-md-4">
            <div class="form-group">
              <label for="exampleInputDate">کد</label>

              <input
                type="text"
                required
                class="form-control"
                v-model="code"
              />
            </div>
          </div>

          <div class="col-md-4"></div>

          <div class="col-md-12">
            <button class="btn btn-success" type="submit">
              <i class="fa fa-plus"></i>
              افزودن
            </button>
          </div>
          <div class="col-12">
            {% include "utility/includes/message.html" %}
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
