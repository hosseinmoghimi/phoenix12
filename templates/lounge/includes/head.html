{% load static %}
<!--- basic page needs
    ================================================== -->


    {% if farsi_font_name %}
    <link
    href="{{STATIC_URL}}leo/css/font-farsi-{{farsi_font_name}}.css" rel="stylesheet"/>
    {% else %}
    <link href="{% static 'leo/css/font-farsi.css' %}" rel="stylesheet" />
    {% endif %}

    <link href="{% static 'leo/css/style.css' %}" rel="stylesheet" />

    <meta name="csrf_token" content="{{ csrf_token }}" />







    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lounge</title>

    <script>
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');
    </script>

    <!-- CSS
    ================================================== -->
    <link rel="stylesheet" href="{{STATIC_URL}}lounge/css/vendor.css">
    <link rel="stylesheet" href="{{STATIC_URL}}lounge/css/styles.css">

    <!-- favicons
    ================================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{STATIC_URL}}lounge/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{STATIC_URL}}lounge/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{STATIC_URL}}lounge/favicon-16x16.png">
    <link rel="manifest" href="{{STATIC_URL}}lounge/site.webmanifest">
