<div>
  <p class="fw-semibold mb-2 text-body">Quantity :</p>
  <div class="d-flex justify-content-between align-items-end">
    <div class="d-flex flex-between-center" data-quantity="data-quantity">
      <button class="btn btn-phoenix-primary px-3"  @click="minus()" >
        <svg
          class="svg-inline--fa fa-minus"
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="minus"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 448 512"
          data-fa-i2svg=""
        >
          <path
            fill="currentColor"
            d="M432 256c0 17.7-14.3 32-32 32L48 288c-17.7 0-32-14.3-32-32s14.3-32 32-32l352 0c17.7 0 32 14.3 32 32z"
          ></path></svg
        ><!-- <span class="fas fa-minus"></span> Font Awesome fontawesome.com --></button
      ><input
        class="form-control text-center input-spin-none bg-transparent border-0 outline-none"
        style="width: 50px"
        type="number"
        min="1"
        v-model="quantity"
      /><button class="btn btn-phoenix-primary px-3" @click="plus()" >
        <svg
          class="svg-inline--fa fa-plus"
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="plus"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 448 512"
          data-fa-i2svg=""
        >
          <path
            fill="currentColor"
            d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"
          ></path></svg
        ><!-- <span class="fas fa-plus"></span> Font Awesome fontawesome.com -->
      </button>
    </div>
    <button class="btn btn-phoenix-primary px-3 border-0">
      <svg
        class="svg-inline--fa fa-share-nodes fs-7"
        aria-hidden="true"
        focusable="false"
        data-prefix="fas"
        data-icon="share-nodes"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 448 512"
        data-fa-i2svg=""
      >
        <path
          fill="currentColor"
          d="M352 224c53 0 96-43 96-96s-43-96-96-96s-96 43-96 96c0 4 .2 8 .7 11.9l-94.1 47C145.4 170.2 121.9 160 96 160c-53 0-96 43-96 96s43 96 96 96c25.9 0 49.4-10.2 66.6-26.9l94.1 47c-.5 3.9-.7 7.8-.7 11.9c0 53 43 96 96 96s96-43 96-96s-43-96-96-96c-25.9 0-49.4 10.2-66.6 26.9l-94.1-47c.5-3.9 .7-7.8 .7-11.9s-.2-8-.7-11.9l94.1-47C302.6 213.8 326.1 224 352 224z"
        ></path></svg
      ><!-- <span class="fas fa-share-alt fs-7"></span> Font Awesome fontawesome.com -->
    </button>
  </div>

  <button
    @click="add_to_cart(shop)"
    class="btn btn-lg btn-warning rounded-pill w-100 fs-9 fs-sm-8"
  >
    <span class="fas fa-shopping-cart me-2"></span>

    <span class="farsi"> افزودن به سبد خرید </span>
  </button>
</div>
