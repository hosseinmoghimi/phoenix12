<link href="{% static 'leo/css/style.css' %}" rel="stylesheet" />

<meta name="csrf_token" content="{{ csrf_token }}" />

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===============================================-->
    <!--    Document Title-->
    <!-- ===============================================-->
    <title>Phoenix</title>

    <!-- ===============================================-->
    <!--    Favicons-->
    <!-- ===============================================-->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'phoenix-theme/assets/img/favicons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'phoenix-theme/assets/img/favicons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'phoenix-theme/assets/img/favicons/favicon-16x16.png' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'phoenix-theme/assets/img/favicons/favicon.ico' %}">
    <link rel="manifest" href="{% static 'phoenix-theme/assets/img/favicons/manifest.json' %}">
    <meta name="msapplication-TileImage" content="{% static 'phoenix-theme/assets/img/favicons/mstile-150x150.png' %}">

    <script src="{% static 'phoenix-theme/vendors/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'phoenix-theme/assets/js/config.js' %}"></script>

    <!-- ===============================================-->
    <!--    Stylesheets-->
    <!-- ===============================================-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="{% static 'phoenix-theme/vendors/simplebar/simplebar.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link href="{% static 'phoenix-theme/assets/css/theme-rtl.min.css' %}" type="text/css" rel="stylesheet" id="style-rtl"> 
    <link href="{% static 'phoenix-theme/assets/css/user-rtl.min.css' %}" type="text/css" rel="stylesheet" id="user-style-rtl"> 
    <script>
      var phoenixIsRTL = window.config.config.phoenixIsRTL;
      phoenixIsRTL = true
      if (phoenixIsRTL || true) {
        var linkDefault = document.getElementById('style-default');
        var userLinkDefault = document.getElementById('user-style-default');
        linkDefault.setAttribute('disabled', true);
        userLinkDefault.setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        var linkRTL = document.getElementById('style-rtl');
        var userLinkRTL = document.getElementById('user-style-rtl');
        linkRTL.setAttribute('disabled', true);
        userLinkRTL.setAttribute('disabled', true);
      }
    </script>
    <link href="{% static 'phoenix-theme/vendors/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
