<div id="accordion-add-school" class="rtl text-right farsi">
  <div class="card" id="add-school-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-school"
          aria-expanded="true"
          aria-controls="collapse-add-school"
        >
          افزودن آموزشگاه
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-school"
      class="collapse  "
      aria-labelledby="heading-add-school"
      data-parent="#accordion-add-school"
    >
      <div class="card-body">
        <form @submit.prevent="add_school()">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="">نام</label>
                <input required v-model="name" type="text" class="form-control" />
              </div>
            </div>
 
 

               

             <div class="col-md-3">
              <div class="form-group">
                <label for="exampleInputDate">کد</label>

                <input
                  type="text"
                  required
                  min="1"
                  class="form-control"
                  v-model="code"
                />
              </div>
            </div>

             <div class="col-md-3">
              <div class="form-group">
                <label for="exampleInputDate">تلفن</label>

                <input
                  type="text"
                  class="form-control"
                  v-model="tel"
                />
              </div>
            </div>

             <div class="col-md-3">
              <div class="form-group">
                <label for="exampleInputDate">آدرس</label>

                <input
                  type="text"
                  class="form-control"
                  v-model="address"
                />
              </div>
            </div>



            <div class="col-md-4"></div>

            <div class="col-md-12">
              <button class="btn btn-success" type="submit">
                <i class="fa fa-plus"></i>
                افزودن
              </button>
            </div>
            <div class="col-12">
              <div class="my-2 mx-2">

                {% include "utility/includes/message.html" %}
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
