<div id="accordion-course-classes" class="rtl text-right farsi">
  <div class="card" id="course-classes-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-course-classes"
          aria-expanded="true"
          aria-controls="collapse-course-classes"
        >
          دروس ارائه شده 
          <span v-if="course_classes.length>0">
            <small class="text-danger mx-2">
              <span v-text="course_classes.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-course-classes"
      class="collapse {% if expand_courses %} show {% endif %}"
      aria-labelledby="heading-course-classes"
      data-parent="#accordion-course-classes"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table {% if DARK_THEME %}table-dark {% endif %}table-striped">
            <thead> 
              <th>سال تحصیلی</th> 
              <th>واحد درسی</th> 
              <th>عنوان</th> 
              <th>مربی ها</th> 
              <th>

              </th>
            </thead>
            <tbody>
              <tr v-for="course_class in course_classes">
               
                <td>
                  <a :href="course_class.educational_year.get_absolute_url">
                    <span v-text="course_class.educational_year.name"></span>
                  </a>
 
                </td>

                 <td>
                  <a :href="course_class.course.get_absolute_url">
                    <span v-text="course_class.course.title"></span>
                  </a>
 
                </td>

                 <td>
                  <a :href="course_class.get_absolute_url">
                    <span v-text="course_class.title"></span>
                  </a>
 
                </td>

                <td>
                  <div class="mb-2" v-for="teacher in course_class.teachers" >

                    <a :href="teacher.get_absolute_url">
                      <div class="media">
                      <img :src="teacher.person.image" class="rounded-circle" width="48" alt="">
                      <div class="media-body mr-2">
                        <span v-text="teacher.full_name"></span>

                      </div>
                    </div>
                  </a>
                    </div>
 
                </td>


             
                <td>
                  <a
                    target="_blank"
                    :href="course_class.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="course_class.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
