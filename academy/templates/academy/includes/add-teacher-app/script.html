<script>
  let add_teacher_app = new Vue({
    el: "#add-teacher-app",
    data: {
    title: "",
    first_name:"",
    personneli_code:"",
    last_name:"", 
    person_id:0,
    melli_code:"", 
    message:{show:false},
    waiting:false,
    event_date: current_date,
    event_time: "00:00:00",
    event_datetime: current_datetime,
    },
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      
      

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

     
      add_teacher: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          first_name: add_teacher_app.first_name,
          last_name: add_teacher_app.last_name,
          melli_code: add_teacher_app.melli_code,
          personneli_code: add_teacher_app.personneli_code,
          person_id: parseInt(add_teacher_app.person_id),
          supplier_id: parseInt(add_teacher_app.supplier_id),
          event_datetime: add_teacher_app.event_date+" "+add_teacher_app.event_time,
        };

        console.log(payload);
        let url = "{% url 'academy:add_teacher' %}"
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            show_message(add_teacher_app,'موفق',data.message,'success',1000)
            if (typeof teachers_app != "undefined") {
              teachers_app.teachers.push(data.teacher);
            }
          }
          else{

            show_message(add_teacher_app,'خطا',data.message,'danger',1000)
          }
        });
      },
    },
  });
</script>
