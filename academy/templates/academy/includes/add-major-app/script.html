<script>
  let add_major_app = new Vue({
    el: "#add-major-app",
    data: {
    title: "",
    code: "",
    level: 1,
    message:{show:false},
    
    event_date: current_date,
    event_time: "00:00:00",
    event_datetime: current_datetime,
    },
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      
      

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

     
      add_major: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          title: add_major_app.title,
          
          
          
        };

        console.log(payload);
        let url = "{% url 'academy:add_major' %}"
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            show_message(add_major_app,'موفق',data.message,'success',1000)
            if (typeof majors_app != "undefined") {
              majors_app.majors.push(data.major);
            }
          }
          else{

            show_message(add_major_app,'خطا',data.message,'danger',1000)
          }
        });
      },
    },
  });
</script>
