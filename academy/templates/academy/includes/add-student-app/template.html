<div id="accordion-add-student" class="rtl text-right farsi">
  <div class="card" id="add-student-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-student"
          aria-expanded="true"
          aria-controls="collapse-add-student"
        >
          افزودن دانش آموز
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-student"
      class="collapse"
      aria-labelledby="heading-add-student"
      data-parent="#accordion-add-student"
    >
      <div class="card-body">
        <form @submit.prevent="add_student()">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for="">نام</label>
                <input
                  required
                  v-model="first_name"
                  type="text"
                  class="form-control"
                />
              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group">
                <label for="">نام خانوادگی</label>
                <input
                  required
                  v-model="last_name"
                  type="text"
                  class="form-control"
                />
              </div>
            </div>

             <div class="col-md-12">
              <div class="form-group">
                <label for="">کد ملی</label>
                <input
                  required
                  v-model="melli_code"
                  type="text"
                  class="form-control"
                />
              </div>
            </div>


            <!-- <div class="col-md-4">
              <div class="form-group">
                <label for="exampleInputDate">تاریخ</label>
                <date-picker v-model="event_date"></date-picker>

                <input
                  type="text"
                  required
                  class="form-control"
                  v-model="event_date"
                />
              </div>
            </div> -->

            <!-- <div class="col-md-4">
              <div class="form-group">
                <label for="exampleInputDate">زمان</label>

                <input
                  type="text"
                  required
                  class="form-control"
                  v-model="event_time"
                />
              </div>
            </div> -->

            <div class="col-md-4"></div>

            <div class="col-md-12">
              <button class="btn btn-success" type="submit">
                <i class="fa fa-plus"></i>
                افزودن
              </button>
            </div>
            <div class="col-12">
              <div class="my-2 mx-2">
                {% include "utility/includes/message.html" %}
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
