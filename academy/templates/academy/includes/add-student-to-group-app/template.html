<div id="accordion-add-student-to-group" class="rtl text-right farsi">
  <div class="card" id="add-student-to-group-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-student-to-group"
          aria-expanded="true"
          aria-controls="collapse-add-student-to-group"
        >
          افزودن دانش آموز
          به گروه
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-student-to-group"
      class="collapse"
      aria-labelledby="heading-add-student-to-group"
      data-parent="#accordion-add-student-to-group"
    >
      <div class="card-body">
        <form @submit.prevent="add_student_to_group()">
          <div class="row">
            
            
            <div class="col-md-12">
              <div class="form-group">
                <label for="">کد ملی دانش آموز
                  <a target="_blank" href="{% url 'academy:students' %}"> همه دانش آموزان</a>


                </label>
                 <input type="text" class="form-control" v-model="student_melli_code">
              </div>
            </div>

             
            
            <div class="col-md-12">
              <div class="form-group">
                <label for="">کد گروه
                  <a target="_blank" href="{% url 'academy:groups' %}"> همه گروه ها</a>

                </label>
                <input 
                  v-model="group_code"
                  class="form-control"
                  type="text"
                /> 
              </div>
            </div>
 
            <div class="col-md-4"></div>

            <div class="col-md-12">
              <button class="btn btn-success" type="submit">
                <i class="fa fa-plus"></i>
                افزودن
              </button>
            </div>
            <div class="col-12">
              <div class="my-2 mx-2">
                {% include "utility/includes/message.html" %}
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
