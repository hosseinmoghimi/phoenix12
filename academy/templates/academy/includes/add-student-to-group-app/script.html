<script>
  let student_melli_code_for_add_student_to_group_app=""
  let group_code_for_add_student_to_group_app=""
</script>
{% if group %}
  <script>
  group_code_for_add_student_to_group_app=("{{group.code}}")
</script>
{% endif %}
{% if student %}
  <script>
  student_melli_code_for_add_student_to_group_app=("{{student.melli_code}}")
</script>
{% endif %}
<script>
  let add_student_to_group_app = new Vue({
    el: "#add-student-to-group-app",
    data: { 
    group_id:0, 
    student_id:0, 
    student_melli_code:student_melli_code_for_add_student_to_group_app,
    group_code:group_code_for_add_student_to_group_app,
    message:{show:false},
    waiting:false, 
    },
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      
      

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

     
      add_student_to_group: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          student_melli_code: add_student_to_group_app.student_melli_code,
          group_code: add_student_to_group_app.group_code,
          student_id: add_student_to_group_app.student_id,
          group_id: add_student_to_group_app.group_id,
        };

        console.log(payload);
        let url = "{% url 'academy:add_student_to_group' %}"
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            show_message(add_student_to_group_app,'موفق',data.message,'success',1000)
            if (typeof students_app != "undefined") {
            }
          }
          else{

            show_message(add_student_to_group_app,'خطا',data.message,'danger',1000)
          }
        });
      },
    },
  });
</script>
