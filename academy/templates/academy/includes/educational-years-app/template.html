{% load static %}
<div id="accordion-educational_years" class="rtl text-right farsi">
  <div class="card" id="educational-years-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-educational_years"
          aria-expanded="true"
          aria-controls="collapse-educational_years"
        >
          سال های تحصیلی
          <span v-if="educational_years.length>0">
            <small class="text-danger mx-2">
              <span v-text="educational_years.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-educational_years"
      class="collapse {% if expand_educational_years %} show {% endif %}"
      aria-labelledby="heading-educational_years"
      data-parent="#accordion-educational_years"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table {% if DARK_THEME %}table-dark {% endif %}table-striped">
            <thead> 
              <th>عنوان</th> 
              <th>

              </th>
            </thead>
            <tbody>
              <tr v-for="educational_year in educational_years">
               
                <td>
                  <a :href="educational_year.get_absolute_url">
                    <span v-text="educational_year.name"></span>
                  </a>
 
                </td>
             
                <td>
                  <a
                    target="_blank"
                    :href="educational_year.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="educational_year.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <div v-if="!show_form">
          <button class="btn btn-success" @click="show_form=true">ایجاد سال جدید</button>
        </div>
        <div v-if="show_form">
          <div class="row rtl"> 
            <div class="col-md-4">
          <input type="text" placeholder="عنوان سال تحصیلی جدید" v-model="name" class="form-control">

            </div>
            <div class="col-md-4">
          <button class="btn btn-success" @click="add_educational_year">ذخیره</button>

            </div>
          </div>
          <div class="my-2">
            <img src="{% static 'img/loading.gif' %}" v-if="waiting" width="32" alt="">
            {% include "utility/includes/message.html" %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
