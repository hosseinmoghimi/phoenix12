<div id="accordion-add-weekly-schedule" class="rtl text-right farsi">
  <div class="card" id="add-weekly-schedule-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-weekly-schedule"
          aria-expanded="true"
          aria-controls="collapse-add-weekly-schedule"
        >
          افزودن برنامه هفتگی
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-weekly-schedule"
      class="collapse"
      aria-labelledby="heading-add-weekly-schedule"
      data-parent="#accordion-add-weekly-schedule"
    >
      <div class="card-body">
        <form @submit.prevent="add_weekly_schedule()">
          <div class="row">
            
           
            <div class="col-md-3">
              <div class="form-group">
                <label for="">آموزشگاه</label>
                <select 
                @input="select_school()"
                  v-model="school_id"
                  type="text"
                  class="form-control"
                >
              {% for school in schools %}
                <option value="{{school.id}}">{{school.name}}</option>
              {% endfor %}
              </select>
              </div>
            </div>

            
            <div class="col-md-3">
              <div class="form-group">
                <label for="">رشته</label>
                 <select 
                @input="select_course_classes()"
                  v-model="major_id"
                  type="text"
                  class="form-control"
                >
              {% for major in majors %}
                <option value="{{major.id}}">{{major.title}}</option>
              {% endfor %}
              </select>
              </div>
            </div>

            
            
            <div class="col-md-3">
              <div class="form-group">
                <label for="">گروه</label>
                 <select 
                @input="select_group()"
                  v-model="group_id"
                  type="text"
                  class="form-control"
                >
              {% for group in groups %}
                <option value="{{group.id}}">{{group.title}}</option>
              {% endfor %}
              </select>
              </div>
            </div>


             <div class="col-md-3">
              <div class="form-group">
                <label for="">درس</label>
                 <select 
                  v-model="course_class_id"
                  type="text"
                  class="form-control"
                >
                <option v-for="course_class in course_classes" :value="course_class.id" v-text="course_class.course.title" ></option>
              </select>
              </div>
            </div>


            
            <div class="col-md-3">
              <div class="form-group">
                <label for="">روز</label>
                 <select 
                  v-model="row"
                  type="text"
                  class="form-control"
                >
                <option value="0">شنبه</option>
                <option value="1">یک شنبه</option>
                <option value="2">دو شنبه</option>
                <option value="3">سه شنبه</option>
                <option value="4">چهار شنبه</option>
                <option value="5">پنج شنبه</option>
                <option value="6">جمعه</option>
              </select>

              </div>
            </div>

               
            <div class="col-md-3">
              <div class="form-group">
                <label for="">زنگ</label>
                 <select 
                  v-model="col"
                  type="text"
                  class="form-control"
                >
                <option value="0">اول</option>
                <option value="1">دوم</option>
                <option value="2">سوم</option>
                <option value="3">چهارم</option>
              </select>

              </div>
            </div>

            <div class="col-md-3">
              <div class="form-group">
                <label for="">ساعت شروع</label>
                 <input type="text" class="form-control" v-model="start_time">

              </div>
            </div>

             <div class="col-md-3">
              <div class="form-group">
                <label for="">ساعت پایان</label>
                 <input type="text" class="form-control" v-model="end_time">

              </div>
            </div>



               

            <div class="col-md-12"></div>

            <div class="col-md-12">
              <button class="btn btn-success" type="submit">
                <i class="fa fa-plus"></i>
                افزودن
              </button>
            </div>
            <div class="col-12">
              <div class="my-2 mx-2">
                {% include "utility/includes/message.html" %}
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
