<script>
  let add_group_app = new Vue({
    el: "#add-group-app",
    data: {
    title: "",
    code: "", 
    message:{show:false},
    
    event_date: current_date,
    event_time: "00:00:00",
    event_datetime: current_datetime,
    },
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      
      

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

     
      add_group: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          title: add_group_app.title,
          code: add_group_app.code,
        };

        console.log(payload);
        let url = "{% url 'academy:add_group' %}"
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            show_message(add_group_app,'موفق',data.message,'success',1000)
            if (typeof groups_app != "undefined") {
              groups_app.groups.push(data.group);
            }
          }
          else{

            show_message(add_group_app,'خطا',data.message,'danger',1000)
          }
        });
      },
    },
  });
</script>
