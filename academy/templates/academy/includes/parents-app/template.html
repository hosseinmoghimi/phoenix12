<div id="accordion-parents" class="rtl text-right farsi">
  <div class="card" id="parents-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-parents"
          aria-expanded="true"
          aria-controls="collapse-parents"
        >
        اولیای
          دانش آموزان
          <span v-if="parents.length>0">
            <small class="text-danger mx-2">
              <span v-text="parents.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-parents"
      class="collapse {% if expand_parents %} show {% endif %}"
      aria-labelledby="heading-parents"
      data-parent="#accordion-parents"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table {% if DARK_THEME %}table-dark {% endif %}table-striped">
            <thead> 
              <th>نام و نام خانوادگی</th> 
              <th>نام خانوادگی</th> 
              <th>نام</th> 
              <th>کد ملی</th> 
              <th>

              </th>
            </thead>
            <tbody>
              <tr v-for="parent in parents">
               
                <td>
                  <a :href="parent.get_absolute_url">
                    <div class="media">
                      <img :src="parent.person.image" width="48" class="rounded-circle" alt="">
                      <div class="media-body mr-2">
                        <span v-text="parent.person.full_name"></span>

                      </div>
                    </div>
                  </a>
 
                </td>

                
                <td>
                  <a :href="parent.get_absolute_url">
                    <span v-text="parent.person.last_name"></span>
                  </a>
 
                </td>


                 <td>
                  <a :href="parent.get_absolute_url">
                    <span v-text="parent.person.first_name"></span>
                  </a>
 
                </td>
                 <td>
                  <a :href="parent.get_absolute_url">
                    <span v-text="parent.person.melli_code"></span>
                  </a>
 
                </td>

                  <td>
                  <a v-for="student in parent.students" :href="student.get_absolute_url">
                    <div class="media">
                      <img :src="student.person.image" width="48" class="rounded-circle" alt="">
                      <div class="media-body mr-2">
                        <span v-text="student.person.full_name"></span>

                      </div>
                    </div>
                  </a>
 
                </td>


             
                <td>
                  <a
                    target="_blank"
                    :href="parent.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="parent.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
