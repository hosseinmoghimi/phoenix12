<div id="accordion-teachers" class="rtl text-right farsi">
  <div class="card" id="teachers-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-teachers"
          aria-expanded="true"
          aria-controls="collapse-teachers"
        >
          دبیر ها
          <span v-if="teachers.length>0">
            <small class="text-danger mx-2">
              <span v-text="teachers.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-teachers"
      class="collapse {% if expand_teachers %} show {% endif %}"
      aria-labelledby="heading-teachers"
      data-parent="#accordion-teachers"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table {% if DARK_THEME %}table-dark {% endif %}table-striped">
            <thead> 
              <th>نام و نام خانوادگی</th> 
              <th>کد پرسنلی</th> 
              <th>کد ملی</th> 
              <th>

              </th>
            </thead>
            <tbody>
              <tr v-for="teacher in teachers">
               
                <td>
                  <a :href="teacher.get_absolute_url">
                    <div class="media">
                      <img :src="teacher.person.image" class="rounded-circle" width="36" alt="">
                      <div class="media-body mr-2">

                        <span v-text="teacher.person.full_name"></span>
                      </div>
                    </div>
                  </a>
 
                </td>
             
                <td>
                  <a :href="teacher.get_absolute_url">
                     
                        <span v-text="teacher.personneli_code"></span>
                      
                  </a>
 
                </td>


                <td>
                  <a :href="teacher.person.get_absolute_url">
                     
                        <span v-text="teacher.person.melli_code"></span>
                      
                  </a>
 
                </td>

             
                <td>
                  <a
                    target="_blank"
                    :href="teacher.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="teacher.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer">
        <div class="my-3">
          <form method="POST" action="{% url 'academy:teachers_excel' %}">
            {% csrf_token %}
            <input type="hidden" name="ids" :value="ids()">
            <button type="submit" class="btn btn-info">
              <i class="fa fa-file-excel-o ml-3"></i>
              دریافت لیست دبیر ها در قالب فایل اکسل
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
