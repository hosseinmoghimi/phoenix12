<div id="accordion-groups" class="rtl text-right farsi">
  <div class="card" id="groups-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-groups"
          aria-expanded="true"
          aria-controls="collapse-groups"
        >
          گروه ها
          <span v-if="groups.length>0">
            <small class="text-danger mx-2">
              <span v-text="groups.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-groups"
      class="collapse {% if expand_groups %} show {% endif %}"
      aria-labelledby="heading-groups"
      data-parent="#accordion-groups"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table
            class="table {% if DARK_THEME %}table-dark {% endif %}table-striped"
          >
            <thead>
              <th>کد</th>
              <th>عنوان</th>
              <th>تعداد دانش آموزان</th>
              <th></th>
            </thead>
            <tbody>
              <tr v-for="group in groups">
                <td>
                  <label for="">
                    <span v-text="group.code"></span>
                  </label>
                </td>

                <td>
                  <a :href="group.get_absolute_url">
                    <div class="media">
                      <img
                        :src="group.thumbnail"
                        class="rounded-circle"
                        width="36"
                        alt=""
                      />
                      <div class="media-body mr-2">
                        <span v-text="group.title"></span>
                      </div>
                    </div>
                  </a>
                </td>

                <td>
                  <label for="">
                    <span v-text="group.student_count"></span>
                  </label>
                </td>

                <td>
                  <a
                    target="_blank"
                    :href="group.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="group.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
