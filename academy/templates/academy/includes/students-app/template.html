<div id="accordion-students" class="rtl text-right farsi">
  <div class="card" id="students-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-students"
          aria-expanded="true"
          aria-controls="collapse-students"
        >
          دانش آموزان
          <span v-if="students.length>0">
            <small class="text-danger mx-2">
              <span v-text="students.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-students"
      class="collapse {% if expand_students %} show {% endif %}"
      aria-labelledby="heading-students"
      data-parent="#accordion-students"
    >
      <div class="card-body">
        <input type="text" class="form-control" placeholder="جستجو ..." v-model="search_for" @input="search()">
        <div class="table-responsive">
          <table class="table {% if DARK_THEME %}table-dark {% endif %}table-striped">
            <thead> 
              <th>نام و نام خانوادگی</th> 
              <th>نام خانوادگی</th> 
              <th>نام</th> 
              <th>کد ملی</th> 
              <th>

              </th>
            </thead>
            <tbody>
              <tr v-for="student in students">
               
                <td>
                  <a :href="student.get_absolute_url">
                    <span v-text="student.full_name"></span>
                  </a>
 
                </td>

                
                <td>
                  <a :href="student.get_absolute_url">
                    <span v-text="student.last_name"></span>
                  </a>
 
                </td>


                 <td>
                  <a :href="student.get_absolute_url">
                    <span v-text="student.first_name"></span>
                  </a>
 
                </td>
                 <td> 
                    <span v-text="student.melli_code"></span>
        
 
                </td>

             
                <td>
                  <a
                    target="_blank"
                    :href="student.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="student.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <div class="my-3">
          <form method="POST" action="{% url 'academy:students_excel' %}">
            {% csrf_token %}
            <input type="hidden" name="ids" :value="ids()">
            <button type="submit" class="btn btn-info">
              <i class="fa fa-file-excel-o ml-3"></i>
              دریافت لیست دانش آموز ها در قالب فایل اکسل
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
