<div id="accordion-set-attendances" class="rtl text-right farsi">
  <div class="card" id="set-attendances-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-set-attendances"
          aria-expanded="true"
          aria-controls="collapse-set-attendances"
        >
          حضور و غیاب
           
        </button>
      </h5>
    </div>

    <div
      id="collapse-set-attendances"
      class="collapse {% if expand_get_attendances %} show {% endif %}"
      aria-labelledby="heading-set-attendances"
      data-parent="#accordion-set-attendances"
    >
      <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <th>
                  دانش آموز
                </th>


                
                <th>
                  
                </th>
                
                <th colspan="4">
                  
                </th>

                
                <th>
                  
                </th>

 

              </thead>
                <tbody>

                    <tr v-for="student in students">
                        <td>

                              <div class="media">
                        <a :href="student.get_absolute_url">
                            <img :src="student.person.image" class="rounded-circle" height="48" alt="">
                        </a>
                        <div class="media-body mr-2">
                            <h6>
                                <a :href="student.get_absolute_url">
                                    <span v-text="student.full_name"></span>
                                </a>
                            </h6>
                            <h6>
                                <a :href="student.get_absolute_url">
                                    <span v-text="student.melli_code"></span>
                                </a>
                            </h6>
                            
                        </div>
                    </div>

                        </td>
                        <td>
                          <input type="text" :id="'desc_'+student.id" class="form-control">
                        </td>
                        <td>
                            <button class="btn btn-success" @click="add_attendance(student.id,`حاضر`)">حاضر</button>

                        </td>
                        <td>
                            <button class="btn btn-warning" @click="add_attendance(student.id,`تاخیر`)">تاخیر</button>

                        </td>
                        <td>

                            <button class="btn btn-danger" @click="add_attendance(student.id,`غایب`)">غایب</button>
                        </td>
                        
                        <td>
                            <button class="btn btn-primary" @click="add_attendance(student.id,`غایب موجه`)">غایب موجه</button>
                        </td>
                        <td>
                           <label :id="'status_'+student.id"   >
                            
                           </label>

                            
                         
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
          
      </div>
    </div>
  </div>
</div>
