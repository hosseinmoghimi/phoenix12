<div id="accordion-attendances" class="rtl text-right farsi">
  <div class="card" id="attendances-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-attendances"
          aria-expanded="true"
          aria-controls="collapse-attendances"
        >
          حضور و غیاب ها
          <span v-if="attendances.length>0">
            <small class="text-danger mx-2">
              <span v-text="attendances.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-attendances"
      class="collapse {% if expand_attendances %} show {% endif %}"
      aria-labelledby="heading-attendances"
      data-parent="#accordion-attendances"
    >
      <div class="card-body">
        <div class="row rtl my-2">
          <div class="col-md-2">
            <button class="btn btn-success" @click="filter(``)">
              همه

              <span v-text="count()"></span>
            </button>
          </div>
          <div class="col-md-2">
            <button class="btn btn-success" @click="filter('حاضر')">
              حاضر

              <span v-text="sum_hazer()"></span>
            </button>
          </div>

          <div class="col-md-2">
            <button class="btn btn-danger" @click="filter('غایب')">
              غایب <span v-text="sum_ghayeb()"></span>
            </button>
          </div>

          <div class="col-md-2">
            <button class="btn btn-primary" @click="filter('غایب موجه')">
              غایب موجه <span v-text="sum_ghayeb_m()"></span>
            </button>
          </div>

          <div class="col-md-2">
            <button class="btn btn-warning" @click="filter('تاخیر')">
              تاخیر <span v-text="sum_takhir()"></span>
            </button>
          </div>
        </div>
        <div class="table-responsive">
          <table
            class="table {% if DARK_THEME %}table-dark {% endif %} table-striped"
          >
            <thead>
              {% if not student %}

              <th>دانش آموز</th>
              {% endif %} {% if not session %}
              <th>جلسه</th>
              {% endif %}

              <th>وضعیت</th>
              <th>توضیحات</th>
              <th></th>
            </thead>
            <tbody>
              <tr v-for="attendance in attendances">
                {% if not student %}

                <td>
                  <div class="media">
                    <a
                    :href="attendance.student.get_absolute_url"
                     
                  >
                    <img height="32" class="rounded-circle"   :src="attendance.student.person.image" alt="">
                  </a>
                    <div class="media-body mr-2">
                  <a
                    :href="attendance.student.get_absolute_url"
                    :class="'text-'+get_color(attendance.status)"
                  >
                    <span v-text="attendance.student.full_name"></span>
                  </a>
                    </div>
                  </div>
                  
                </td>
                {% endif %} {% if not session %}

                <td>
                  <a :href="attendance.session.get_absolute_url">
                    <div>
                      <span v-text="attendance.session.title"></span>
                    </div>
                    <div>
                      <span
                        v-text="attendance.session.persian_start_datetime"
                      ></span>
                    </div>
                  </a>
                </td>
                {% endif %}

                <td>
                  <span
                    :class="'text-'+get_color(attendance.status)"
                    v-text="attendance.status"
                  ></span>
                </td>
                <td>
                  <span :class="'text-'+get_color(attendance.status)" v-text="attendance.description"></span>
                </td> 


                <td class="small">
                  <a
                    target="_blank"
                    :href="attendance.get_edit_url"
                    title="ویرایش"
                    class="text-warning mx-2"
                  >
                    <i class="fa fa-edit text-warning"> </i>
                    ویرایش
                  </a>
                  <a
                    target="_blank"
                    :href="attendance.get_delete_url"
                    title="حذف"
                    class="text-danger mx-2"
                  >
                    <i class="fa fa-trash text-danger"> </i>
                    حذف
                  </a>
                </td>
              </tr>
            </tbody>
            <tfoot>
              <th></th>
              <th>
                <div class="text-success" v-if="(sum_hazer()+sum_takhir())>0">
                  تعداد حاضرین =
                  <span v-text="sum_hazer()+sum_takhir()"></span>
                  <!-- نفر -->
                </div>

                <div class="text-danger" v-if="(sum_ghayeb()+sum_ghayeb_m())>0">
                  تعداد غایبین =
                  <span v-text="sum_ghayeb()+sum_ghayeb_m()"></span>
                  <!-- نفر -->
                </div>
              </th>
              {% if not student %}

              <th></th>

              {% endif %} 
              {% if not session %}

              <th></th>
              {% endif %}

              <th></th>
              <th></th>
            </tfoot>
          </table>
        </div>
      </div>

      <div class="card-footer">
        <div class="my-3">
          <form method="POST" action="{% url 'academy:attendances_excel' %}">
            {% csrf_token %}
            <input type="hidden" name="ids" :value="ids()" />
            <button type="submit" class="btn btn-info">
              <i class="fa fa-file-excel-o ml-3"></i>
              دریافت لیست حضور و غیاب در قالب فایل اکسل
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
