<script>
    
    let attendances_for_attendances_app=JSON.parse("{{attendances_s|escapejs}}")
    let attendances_app = new Vue({
        el: "#attendances-app",
        data: {
            attendances: attendances_for_attendances_app
        },
        methods: {
            filter:function(status){
                if(status===""){
                    this.attendances=attendances_for_attendances_app
                    return
                }
                else{
                    this.attendances=attendances_for_attendances_app.filter(attendance => {
                        if(attendance.status==status){
                            return true
                        }
                    });
                }
            }, 
            count:function(){
                return attendances_for_attendances_app.length
            },
            ids:function(){
                let ids=[]
                this.attendances.forEach(attendance => {
                    ids.push(attendance.id)
                    
                });
                return JSON.stringify(ids)
            },
            to_price: function(vall) { 
                return  to_price(vall) 
            },
            get_color:function(vall){
                if(vall==='غایب')
                    return 'danger'
                if(vall==='حاضر')
                    return 'success'
                if(vall==='تاخیر')
                    return 'warning'
                return 'primary'
            },
            sum_hazer:function(){
                let s=0
                attendances_for_attendances_app.forEach(attendance => {
                    if(attendance.status=='حاضر')
                    s+=1 
                });
                return s
            },

            sum_takhir:function(){
                let s=0
                attendances_for_attendances_app.forEach(attendance => {
                    if(attendance.status=='تاخیر')
                    s+=1
                      
                });
                return s
            },
            sum_ghayeb:function(){
                let s=0
                attendances_for_attendances_app.forEach(attendance => {
                    if(attendance.status=='غایب')
                    s+=1 
                });
                return s
            },
            
            sum_ghayeb_m:function(){
                let s=0
                attendances_for_attendances_app.forEach(attendance => {
                     
                     if(attendance.status=='غایب موجه')
                    s+=1
                });
                return s
            }
        }
    })
</script>
