 
<script>
  let add_course_class_app = new Vue({
    el: "#add-course-class-app",
    data: {
    title: "",
    course_id: 0,
    school_id: 0,
    level:0,
    major_id: 0,
    educational_year_id: 0,
    message:{show:false},
    waiting:false,
    
    event_date: current_date,
    event_time: "00:00:00",
    event_datetime: current_datetime,
    },
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      
      

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

     
      add_course_class: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          educational_year_id: parseInt(add_course_class_app.educational_year_id),
          course_id: parseInt(add_course_class_app.course_id),
          major_id: parseInt(add_course_class_app.major_id),
          school_id: parseInt(add_course_class_app.school_id),
          level: parseInt(add_course_class_app.level),
          event_datetime: add_course_class_app.event_date+" "+add_course_class_app.event_time,
        };

        console.log(payload);
        let url = "{% url 'academy:add_course_class' %}"
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            show_message(add_course_class_app,'موفق',data.message,'success',1000)
            if (typeof courses_app != "undefined") {
              courses_app.courses.push(data.course);
            }
          }
          else{

            show_message(add_course_class_app,'خطا',data.message,'danger',1000)
          }
        });
      },
    },
  });
</script>
