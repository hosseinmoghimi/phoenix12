<div id="accordion-add-course-class" class="rtl text-right farsi">
  <div class="card" id="add-course-class-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-course-class"
          aria-expanded="true"
          aria-controls="collapse-add-course-class"
        >
          افزودن واحد درسی ارئه شده
          
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-course-class"
      class="collapse  "
      aria-labelledby="heading-add-course-class"
      data-parent="#accordion-add-course-class"
    >
      <div class="card-body">
        <form @submit.prevent="add_course_class()">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for="">واحد درسی</label>
                <select v-model="course_id" class="form-control" >
                  {% for course in courses %}
                    <option value="{{course.id}}">{{course.title}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>


             <div class="col-md-12">
              <div class="form-group">
                <label for="">سال تحصیلی</label>
                <select v-model="educational_year_id" class="form-control" >
                  {% for educational_year in educational_years %}
                    <option value="{{educational_year.id}}">{{educational_year.name}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

 
 

              <div class="col-md-4">
              <div class="form-group">
                <label for="exampleInputDate">تاریخ</label>
                <date-picker v-model="event_date"></date-picker>

                <input
                  type="text"
                  required
                  class="form-control"
                  v-model="event_date"
                />
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-group">
                <label for="exampleInputDate">زمان</label>

                <input
                  type="text"
                  required
                  class="form-control"
                  v-model="event_time"
                />
              </div>
            </div>

            <div class="col-md-4"></div>

            <div class="col-md-12">
              <button class="btn btn-success" type="submit">
                <i class="fa fa-plus"></i>
                افزودن
              </button>
            </div>
            <div class="col-12">
              <div class="my-2 mx-2">

                {% include "utility/includes/message.html" %}
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
