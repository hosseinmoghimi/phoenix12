<div id="accordion-add-course-class" class="rtl text-right farsi">
  <div class="card" id="add-course-class-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-course-class"
          aria-expanded="true"
          aria-controls="collapse-add-course-class"
        >
          افزودن واحد درسی ارئه شده
          
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-course-class"
      class="collapse  "
      aria-labelledby="heading-add-course-class"
      data-parent="#accordion-add-course-class"
    >
      <div class="card-body">
        <form @submit.prevent="add_course_class()">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for="">واحد درسی</label>
                <select v-model="course_id" class="form-control" >
                  {% for course in courses %}
                    <option value="{{course.id}}">{{course.title}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>


             <div class="col-md-4">
              <div class="form-group">
                <label for="">سال تحصیلی</label>
                <select v-model="educational_year_id" class="form-control" >
                  {% for educational_year in educational_years %}
                    <option value="{{educational_year.id}}">{{educational_year.name}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-group">
                <label for="">آموزشگاه</label>
                <select v-model="school_id" class="form-control" >
                  {% for school in schools %}
                    <option value="{{school.id}}">{{school.name}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-group">
                <label for="">رشته تحصیلی</label>
                <select v-model="major_id" class="form-control" >
                  {% for major in majors %}
                    <option value="{{major.id}}">{{major.title}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

              <div class="col-md-4">
              <div class="form-group">
                <label for="">گروه</label>
                <select v-model="group_id" class="form-control" >
                  {% for group in groups %}
                    <option value="{{group.id}}">{{group.title}}</option>
                  {% endfor %}
                </select>
              </div>
            </div>



            <div class="col-md-4">
              <div class="form-group">
                <label for="">سطح</label>
                <select v-model="level" class="form-control" >
                  
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                
                </select>
              </div>
            </div>


 
 

              <div class="col-md-4">
              <div class="form-group">
                <label for="exampleInputDate">تاریخ</label>
                <date-picker v-model="event_date"></date-picker>

                <input
                  type="text"
                  required
                  class="form-control"
                  v-model="event_date"
                />
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-group">
                <label for="exampleInputDate">زمان</label>

                <input
                  type="text"
                  required
                  class="form-control"
                  v-model="event_time"
                />
              </div>
            </div>

            <div class="col-md-4"></div>

            <div class="col-md-12">
              <button class="btn btn-success" type="submit">
                <i class="fa fa-plus"></i>
                افزودن
              </button>
            </div>
            <div class="col-12">
              <div class="my-2 mx-2">

                {% include "utility/includes/message.html" %}
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
