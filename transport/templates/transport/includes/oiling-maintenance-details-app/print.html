{% load to_persian_date %} {% load to_price %} {% load to_amount_color %} {% load static %}
 
{% if oiling_maintenance_details %}
 <div class="card" id="oiling_maintenance_details-app">
    <div class="card-header" id="heading-oiling-maintenance-details">
      <h5 class="text-center">
     
          جزئیات گریسکاری و روغن کاری
          <span v-if="oiling_maintenance_details.length>0">
            <small class="text-danger mx-2">
              <span v-text="oiling_maintenance_details.length"></span>
            </small>
          </span>
          

      </h5>
    </div>
   
      <div class="card-body">
        <img
          src="{% static 'leo/img/loading.gif' %}"
          width="32"
          v-if="waiting"
          alt=""
        />

        <div class="table-responsive rtl">
          <img
            v-if="false"
            width="32"
            src="{% static 'leo/img/loading.gif' %}"
            alt=""
          />
          <h6 v-if="false">
            <span class="text-muted">در حال بار گذاری ... </span>
          </h6>
          <table class="table table-striped rtl">
            <thead>
              <th>نوع فیلتر</th>
              <th>نوع سرویس</th>
              <th>تعداد</th>
              <th>هزینه</th> 
            </thead>
            <tbody>
              <tr
                v-for="oiling_maintenance_detail in oiling_maintenance_details"
              >
                <td>
                  <span v-text="oiling_maintenance_detail.filter_type"> </span>
                  <div>

                      <small class="text-muted">
                          
                          <span v-text="oiling_maintenance_detail.description"></span>
                        </small>
                    </div>


                </td>

                <td>
                  <span v-text="oiling_maintenance_detail.filter_action">
                  </span>
                </td>

                <td>
                  <span v-text="(oiling_maintenance_detail.count)"> </span>
                </td>

                <td>
                  <span v-text="to_price(oiling_maintenance_detail.cost)">
                  </span>
                  {{CURRENCY}}
                </td>

              

               
              </tr>
            </tbody>
            <tfoot>
              <th></th>
              <th></th>
              <th>
                <div class="text-left">جمع</div>
              </th>
              <th>
                <span v-text="sum_total()"></span>
              </th> 
            </tfoot>
          </table>
        </div>
      </div>
      <div class="card-footer">
        
      </div>
    </div>
{% else %}
<div class="alert alert-secondary">
    <h5 class="text-center">
        جزییاتی ثبت نشده است.
    </h5>
</div>
{% endif %}
