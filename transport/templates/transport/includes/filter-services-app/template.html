{% load static %}
<div id="accordion-filter-services" class="rtl text-right farsi">
  <div class="card" id="filter-services-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-filter-services"
          aria-expanded="true"
          aria-controls="collapse-filter-services"
        >
سرویس های فیلتر

<span v-if="filter_services.length>0">
            <small class="text-danger mx-2">
              <span v-text="filter_services.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-filter-services"
      class="collapse {% if expand_filter_services %} show {% endif %}"
      aria-labelledby="heading-filter-services"
      data-parent="#accordion-filter-services"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table {% if DARK_THEME %}table-dark {% endif %}table-striped">
            <thead>
              <th>نوع فیلتر</th> 
              <th>تعداد</th>
              <th>برآورد هزینه</th>
              <th>توضیحات</th> 
            </thead>
            <tbody>
              <tr v-for="filter_service in filter_services">
                <td>
                 <div class="media">
                      <img src="{% static 'transport/img/filter.png' %}" width="32" class="rounded-circle" alt="">
                    <div class="media-body mr-2">
                          <h6 v-text="filter_service.filter_action"></h6>
                        <span v-text="filter_service.filter_type"></span>
                </div>
            </div>
                </td>

               

                
                <td>
                        <h6 v-text="filter_service.count"></h6>
                </td>
                   

                
                   <td>
                    <div v-if="filter_service.cost" >

                        <span v-text="to_price(filter_service.cost)">
                            
                        </span>
                        <img src="{% static 'leo/img/rial.png' %}" width="28" alt="{{CURRENCY}}">   
                    </div>
                </td>

                 <td>
                        <h6 v-text="filter_service.description"></h6>
                </td>



               
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
