{% load static %}
<div id="accordion-add-filter-service-form" class="rtl text-right farsi">
  <div class="card" id="add-filter-service-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-add-filter-service-form"
          aria-expanded="true"
          aria-controls="collapse-add-filter-service-form"
        >
افزودن سرویس فیلتر
 
 
        </button>
      </h5>
    </div>

    <div
      id="collapse-add-filter-service-form"
      class="collapse  "
      aria-labelledby="heading-add-filter-service-form"
      data-parent="#accordion-add-filter-service-form"
    >
      <div class="card-body">
      <div class="row">
        
        <div class="col-md-12">
          <hr />
        </div>

        <div class="col-md-4">

          <div class="form-group">
            <label for="">نوع فیلتر</label>
            <select v-model="filter_type" type="text" class="form-control">
              {% for filter_type in filter_types %}
              <option value="{{filter_type}}">{{filter_type}}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="">نوع سرویس</label>
            <select v-model="filter_action" type="text" class="form-control"> 
              {% for filter_action in filter_actions %}
              <option value="{{filter_action}}">{{filter_action}}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="col-md-2">
          <div class="form-group">
            <label for="exampleInputDate">تعداد</label>

            <input
              type="number"
              required
              class="form-control"
              v-model="count"
            />
          </div>
        </div>

        
        <div class="md-12">

        </div>

        <div class="col-md-3">
          <div class="form-group">
            <label for="exampleInputDate">برآورد هزینه
              <span class="mx-2" v-text="to_price(cost)"></span>
              {{CURRENCY}}
            </label>
            <input
              type="number"
              required
              class="form-control"
              v-model="cost"
            />
          </div>
        </div>

        <div class="col-md-9">
          <div class="form-group">
            <label for="exampleInputDate">توضیحات</label>

            <input
              type="text"
              required
              class="form-control"
              v-model="description"
            />
          </div>
        </div>

        <div class="col-md-12"></div>
        <div class="col-md-3 my-3">
          <div v-if="!confirm_clear_filters">
            <button class="btn btn-success" @click="add_filter()">
              <i class="fa fa-plus mx-2"></i>
              افزودن سرویس فیلتر
            </button>
          </div>

          <div v-if="!confirm_clear_filters" class="mt-2">
            <button class="btn btn-danger" @click="confirm_clear_filters=true">
              <i class="fa fa-plus mx-2"></i>
              حذف همه
            </button>
          </div>
          <div v-if="confirm_clear_filters">
            <h5>همه خدمات فیلتر حذف شوند؟</h5>
            <button class="btn btn-danger" @click="clear_filters()">
              <i class="fa fa-plus mx-2"></i>

              حذف کن
            </button>

            <button class="btn btn-secondary" @click="confirm_clear_filters=false">
              <i class="fa fa-plus mx-2"></i>

              خیر
            </button>
          </div>
        </div>
         
      </div>
        
      </div>
    </div>
  </div>
</div>
