<script>
    let maintenance_invoices_for_maintenance_invoices_app = JSON.parse(`{{maintenance_invoices_s|escapejs}}`)
    let maintenance_invoices_app = new Vue({
        el: "#maintenance-invoices-app",
        data: {
            maintenance_invoices: maintenance_invoices_for_maintenance_invoices_app,
            search_for: '',
            waiting: false,

        },
        methods: {
            sum:function(){
                let s=0
                this.maintenance_invoices.forEach(maintenance_invoice => {
                    s+=maintenance_invoice.manual_amount
                });
                return to_price(s)
            },
            filter: function () {
                maintenance_invoices_app.maintenance_invoices = maintenance_invoices_for_maintenance_invoices_app.filter(function (invoice) {

                    if (invoice.title.indexOf(maintenance_invoices_app.search_for) > -1)
                        return true
                    if (invoice.bedehkar.full_name.indexOf(maintenance_invoices_app.search_for) > -1)
                        return true
                    if (invoice.bestankar.full_name.indexOf(maintenance_invoices_app.search_for) > -1)
                        return true
                    return false

                })
            },
            to_price: function (vall) {
                return to_price(vall, " ")
            },

        }
    })
</script>
