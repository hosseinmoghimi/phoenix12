<script>
    let url_import_drivers_from_excel = "{% url 'transport:import_drivers_from_excel' %}"
    let import_drivers_from_excel_app = new Vue({
        el: "#import-drivers-from-excel-app",
        data: {
            waiting: false,
            new_download_file: '',
            count:1000,
            is_open: false,
            message:{show:false},
        },
        methods: {
            import_drivers_from_excel: function () {
                import_drivers_from_excel_app.waiting = true
                let title = this.new_download_title
                let formData = new FormData();
                let file1 = $('#import-drivers-from-excel-form')[0].elements[0].files[0]
                formData.append("file1", file1);
                formData.append("is_open", import_drivers_from_excel_app.is_open);
                formData.append("count", import_drivers_from_excel_app.count);
                formData.append("csrfmiddlewaretoken", csrfmiddlewaretoken);
                $.ajax({
                    url: url_import_drivers_from_excel,
                    type: 'post',
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function (data) {
                        import_drivers_from_excel_app.waiting = false

                        if (data != 0) {
                            console.log(data)
                            if (data.result === 'SUCCEED') { 
                                show_message(import_drivers_from_excel_app,"موفقیت آمیز",data.message,"success",10000)   
                                    if(typeof drivers_app != "undefined"){
                                        drivers_app.drivers=(data.drivers)
                                }
                            }
                            if (data.result != 'SUCCEED') { 
                                show_message(import_drivers_from_excel_app,"خطا",data.message,"danger",10000)   

                            }
                        }
                        else {
                        }
                    },
                });

            },

        }
    })
</script>
