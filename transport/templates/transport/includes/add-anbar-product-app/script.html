 
<script>
  let add_anbar_product_app = new Vue({
    el: "#add-anbar-product-app",
    data: {
      anbar_product_code:"",
      license_no:"",
      name:"",
      anbar:"",
      vehicle_code:"",
      unit_price:0,
      quantity:1, 
      shift_date:current_date,
      shift:'روز',
      description:"",
      message:{show:false},
      waiting:false,
    },
    
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    
    methods: {
      select_account: function () {
        select_person_account_by_code(add_anbar_product_app.account_code).done((data) => {
          if (data.result === "SUCCEED") {
            leolog(data.person_account);
            add_anbar_product_app.account = data.person_account;
          }

          if (data.result === "FAILED") {
            add_anbar_product_app.account={};
          }
        });
      },

      to_price: function (vall) {
        return to_price(vall) + " ";
      },

      add_anbar_product: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          anbar: this.anbar,
          name: this.name,
          vehicle_code: this.vehicle_code,
          unit_price: parseInt(this.unit_price),
          quantity: parseInt(this.quantity),
          shift_date: this.shift_date,
          shift: this.shift,
          description: this.description,
         
        };


 


        console.log(payload);
        let url = "{% url 'transport:add_anbar_product' %}";
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            if (typeof anbar_products_app != "undefined") {
              anbar_products_app.anbar_products.push(data.anbar_product);
            }
            show_message(add_anbar_product_app,'موفق',data.message,'success',3000)
          }
          else{
            show_message(add_anbar_product_app,'خطا',data.message,'danger',3000)
          }
        });
      },
    },
  });
</script>
