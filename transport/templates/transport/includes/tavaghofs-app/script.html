<script>
    
    let tavaghofs_for_tavaghofs_app=JSON.parse("{{tavaghofs_s|escapejs}}")
    let tavaghofs_app = new Vue({
        el: "#tavaghofs-app",
        data: {
            tavaghofs: tavaghofs_for_tavaghofs_app
        },
        methods: {
            to_price: function(vall) { 
                return  to_price(vall) 
            },
            sum_duration:function(){
                let s=0
                this.tavaghofs.forEach(tavaghof => {
                    s+=tavaghof.duration
                });
                return to_price(s)
            },
        }
    })
</script>
