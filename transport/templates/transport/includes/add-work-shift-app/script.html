<script>
  let add_work_shift_app = new Vue({
    el: "#add-work-shift-app",
    data: {
      
      vehicle_id: 0,
      vehicle_code: "",
      driver_id: 0, 
      location: "",
      description: "",

      
      bar: "",
      bar_count: 0,

      
      shift: "",
      shift_date: current_date,
      start_hour: 0,
      end_hour: 0,

      vehicle_start_hour: 0,
      vehicle_end_hour:0,


      
      gasoil_liter: 0,
      
      oil_type: "",
      oil_action: "",
      oil_liter: 0,
      oil_vehicle_hour: 0,
      oil_cost:0,
      oil_description:'',
      oils:[],



      filter_type: "",
      filter_action: "تعویض",
      filter_count: 1,
      filter_cost: 0, 
      filter_description: '', 
      filters:[],

      tavaghof_cause: "",
      tavaghof_duration: 0,
      tavaghof_description: "",
      tavaghof_vehicle_hour:0,
      tavaghofs:[],

      message: { show: false },
      waiting: false,

      product_name:"",
      product_unitprice:0,
      product_quantity:1,
      product_anbar:"",
      product_serviceman:"",
      product_description:"",

      products:[],




      confirm_clear_products: false,
      confirm_clear_filters: false,
      confirm_clear_tavaghofs: false,
      confirm_clear_oils: false,
    },

    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      sum_filter_count:()=>{
        let s=0
        add_work_shift_app.filters.forEach(filter => {
          s+=parseInt(filter.count)
          
        });
        return s
      },

      
      sum_product_quantity:()=>{
        let s=0
        add_work_shift_app.products.forEach(product => {
          s+=parseInt(product.quantity)
          
        });
        return s
      },

      
      sum_product_price:()=>{
        let s=0
        add_work_shift_app.products.forEach(product => {
          s+=parseInt(product.unit_price*product.quantity)
          
        });
        return s
      },


      sum_filter_cost:()=>{
        let s=0
        add_work_shift_app.filters.forEach(filter => {
          s+=parseInt(filter.cost)
          
        });
        return to_price(s)
      },
      sum_oil_liter:()=>{
        let s=0
        add_work_shift_app.oils.forEach(oil => {
          s+=parseFloat(oil.oil_liter)
          
        });
        return to_price(s)
      },

      
      sum_tavaghof:()=>{
        let s=0
        add_work_shift_app.tavaghofs.forEach(tavaghof => {
          s+=parseFloat(tavaghof.duration)
          
        });
        return to_price(s)
      },

      
      sum_oil_cost:()=>{
        let s=0
        add_work_shift_app.oils.forEach(oil => {
          s+=parseFloat(oil.cost)
          
        });
        return to_price(s)
      },

      clear_filters: function () {
        this.filters = [];
        this.confirm_clear_filters=false
      },


      
      clear_products: function () {
        this.products = [];
        this.confirm_clear_products=false
      },


      
      clear_tavaghofs: function () {
        this.tavaghofs = [];
        this.confirm_clear_tavaghofs=false
      },


      clear_oils: function () {
        this.oils = [];
        this.confirm_clear_oils=false
      },

      add_filter: function () {
        if (!(this.filter_type && this.filter_action && this.filter_count>0)) {
          return;
        }
        this.filters.push({
          filter_type: add_work_shift_app.filter_type,
          filter_action: add_work_shift_app.filter_action,
          count: add_work_shift_app.filter_count,
          cost: add_work_shift_app.filter_cost,
          description: add_work_shift_app.filter_description,
        });
      },

      
      add_product: function () {
        if (!(this.product_name && this.product_quantity>0)) {
          return;
        }
        this.products.push({
          name: add_work_shift_app.product_name,
          quantity: add_work_shift_app.product_quantity,
          unit_price: add_work_shift_app.product_unitprice,
          anbar: add_work_shift_app.product_anbar,
          service_man: add_work_shift_app.product_serviceman,
          description: add_work_shift_app.product_description,
        });
      },

      
      add_oil: function () {
        if (!(this.oil_type && this.oil_action && this.oil_liter>0)) {
          return;
        }
        this.oils.push({
          oil_type: add_work_shift_app.oil_type,
          oil_action: add_work_shift_app.oil_action,
          oil_liter: add_work_shift_app.oil_liter,
          cost: add_work_shift_app.oil_cost,
          description: add_work_shift_app.oil_description,
          oil_vehicle_hour: add_work_shift_app.oil_vehicle_hour,
        });
      },

      
      add_tavaghof: function () {
        if (!(this.tavaghof_cause   && this.tavaghof_duration>0)) {
          return;
        }
        let t={
          cause: add_work_shift_app.tavaghof_cause,
          duration: parseFloat(add_work_shift_app.tavaghof_duration),
          description: add_work_shift_app.tavaghof_description,
          vehicle_hour: add_work_shift_app.tavaghof_vehicle_hour,
        }

        console.log(t)
        this.tavaghofs.push(t);
      },

      
      select_person_account: function () {
        select_person_account_by_code(
          add_person_account_app.person_account_code,
        ).done((data) => {
          if (data.result === "SUCCEED") {
            leolog(data.person_account);
            add_person_account_app.person_account = data.person_account;
          }

          if (data.result === "FAILED") {
            add_person_account_app.person_account = {};
          }
        });
      },

      to_price: function (vall) {
        return to_price(vall);
      },

      add_work_shift: function () {
        console.log(this.tavaghofs)
        console.log(this.filters)
        console.log(this.oils)
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,

          vehicle_code: (this.vehicle_code),
          driver_id: (this.driver_id),
          location: this.location,
          
          oils: this.oils, 

          shift_date: this.shift_date,
          shift: this.shift,
          start_hour: (this.start_hour),
          end_hour: (this.end_hour),

          vehicle_start_hour: (this.vehicle_start_hour),
          vehicle_end_hour: (this.vehicle_end_hour),
 
          bar: this.bar,
          bar_count: parseInt(this.bar_count),
          
          description: this.description,
          
          
          gasoil_liter: (this.gasoil_liter),
          
          filters: JSON.stringify(this.filters),
          oils: JSON.stringify(this.oils),
          tavaghofs: JSON.stringify(this.tavaghofs),
          products: JSON.stringify(this.products),
          
         

        };

        console.log(payload);
        let url = "{% url 'transport:add_work_shift' %}";
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            if (typeof work_shifts_app != "undefined") {
              work_shifts_app.work_shifts.push(data.work_shift);
            }
            add_work_shift_app.vehicle_code=""
            add_work_shift_app.driver_id=0
            add_work_shift_app.products=[]
            add_work_shift_app.oils=[]
            add_work_shift_app.filters=[]
            add_work_shift_app.tavaghofs=[]
            show_message(
              add_work_shift_app,
              "موفق",
              data.message,
              "success",
              3000,
            );
          } else {
            show_message(
              add_work_shift_app,
              "خطا",
              data.message,
              "danger",
              3000,
            );
          }
        });
      },
    },
  });
</script>
