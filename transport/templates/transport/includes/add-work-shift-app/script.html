<script>
  let add_work_shift_app = new Vue({
    el: "#add-work-shift-app",
    data: {

      title: "",
      vehicle_id:0,
      vehicle_code:"",

      shift_date: current_date,

      shift:"",

      start_hour:0,
      end_hour:0,

      driver_id:0,
      driver_code:"",

      location:"",
      description:"",

      oil_type:"",
      oil_liter:0,
      gasoil_liter:0,
      vehicle_hour:0,

      filter_type:"",
      filter_action:"",
      count:0,
      cost:0,

      tavaghof_cause:"",
      tavaghof_duration:0,
      tavaghof_description:"",

      kharabi_duration:0,
      kharabi_description:"",

      message:{show:false},
      waiting:false,
    },
    
    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      select_person_account: function () {
        select_person_account_by_code(add_person_account_app.person_account_code).done((data) => {
          if (data.result === "SUCCEED") {
            leolog(data.person_account);
            add_person_account_app.person_account = data.person_account;
          }

          if (data.result === "FAILED") {
            add_person_account_app.person_account={};
          }
        });
      },

      to_price: function (vall) {
        return to_price(vall)  ;
      },

      add_work_shift: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          person_account_id: this.person_account.id,
        };

        console.log(payload);
        let url = "{% url 'transport:add_work_shift' %}";
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);
          if (data.result === "SUCCEED") {
            if (typeof work_shifts_app != "undefined") {
              work_shifts_app.work_shifts.push(data.work_shift);
            }
            show_message(add_work_shift_app,'موفق',data.message,'success',3000)
          }
          else{
            show_message(add_work_shift_app,'خطا',data.message,'danger',3000)
          }
        });
      },
    },
  });
</script>
