<script>
  let add_vehicle_status_app = new Vue({
    el: "#add-vehicle-status-app",
    data: {

 

      vehicle_code: 0,
      location: "",
      kilometer: 0,
      hour: 0,
      motor:"",
      gear_box:"",
      ziroband:"",
      cabin:"",
      cooler:"",
      heater:"",
      wiring:"",
      light:"",
      hydrolic:"",
      pakat:"",
      compress:"",
      description: "", 
      event_date: current_date,
      event_time: current_time,
      status_datetime: current_datetime,
      

      waiting: false,
      message: { show: false },
    },

    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      to_price_colored: function (vall) {
        let colorr = "primary";
        if (vall > 0) {
          colorr = "success";
        }

        if (vall < 0) {
          colorr = "danger";
        }

        return `<span class="text-${colorr}">${to_price(
          vall
        )} {{CURRENCY}}</span>`;
      },
      separate: (vall) => to_price(parseInt(vall), ""),

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

      add_vehicle_status: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          title: this.title,
          vehicle_code:  (this.vehicle_code),
          hour: parseInt(this.hour),
          kilometer: parseInt(this.kilometer),
          location: this.location,
          description: this.description,
          motor:  (this.motor),
          gear_box:this.gear_box,
          ziroband:this.ziroband,
          cabin:this.cabin,
          cooler:this.cooler,
          heater:this.heater,
          wiring:this.wiring,
          light:this.light,
          hydrolic:this.hydrolic,
          pakat:this.pakat,
          compress:this.compress,
          description:this.description,
          pakat:this.pakat,
          pakat:this.pakat,
          status_datetime: this.event_date + " " + this.event_time,
        };

        console.log(payload);
        let url = "{% url 'transport:add_vehicle_status' %}";
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);

          if (data.result === "SUCCEED") {
            add_vehicle_status_app.title = "";
            show_message(
              add_vehicle_status_app,
              "موفق",
              data.message,
              "success",
              5000
            );
            if (typeof vehicle_statuses_app != "undefined") {
              vehicle_statuses_app.vehicle_statuses.push(data.vehicle_status);
            }
          } else {
            show_message(
              add_vehicle_status_app,
              "خطا",
              data.message,
              "danger",
              5000
            );
          }
        });
      },
    },
  });
</script>
