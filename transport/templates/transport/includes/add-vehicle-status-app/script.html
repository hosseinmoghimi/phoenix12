<script>
  let add_vehicle_status_app = new Vue({
    el: "#add-vehicle-status-app",
    data: {
      kilometer: 0,
      hour: 0,
      vehicle_id: 0,
      description: "",
      maintenance_type: "",
      event_date: current_date,
      event_time: current_time,
      event_datetime: current_datetime,
      

      waiting: false,
      message: { show: false },
    },

    components: {
      DatePicker: VuePersianDatetimePicker,
    },
    methods: {
      to_price_colored: function (vall) {
        let colorr = "primary";
        if (vall > 0) {
          colorr = "success";
        }

        if (vall < 0) {
          colorr = "danger";
        }

        return `<span class="text-${colorr}">${to_price(
          vall
        )} {{CURRENCY}}</span>`;
      },
      separate: (vall) => to_price(parseInt(vall), ""),

      to_price: function (vall) {
        return to_price(vall) + " {{CURRENCY}}";
      },

      add_maintenance: function () {
        let payload = {
          csrfmiddlewaretoken: csrfmiddlewaretoken,
          title: this.title,
          vehicle_id: parseInt(this.vehicle_id),
          service_man_id: parseInt(this.service_man_id),
          maintenance_type: this.maintenance_type,
          description: this.description,
          hour: parseInt(this.hour),
          fuel_liter:this.fuel_liter,

          
          oil_type: this.oil_type,
          oil_liter: this.oil_liter,
          oil_filter: this.oil_filter,
          gasoil_filter: this.gasoil_filter,
          Hydrolic_filter: this.Hydrolic_filter,
          nano_filter: this.nano_filter,
          abgir_filter: this.abgir_filter,
          tank_filter: this.tank_filter,
          bokharkesh_filter: this.bokharkesh_filter,
          lajangir_filter: this.lajangir_filter,

          kilometer: parseInt(this.kilometer),
          event_datetime: this.event_date + " " + this.event_time,
        };

        console.log(payload);
        let url = "{% url 'transport:add_oiling' %}";
        let posting = $.post(url, payload);
        posting.done((data) => {
          console.log(data);

          if (data.result === "SUCCEED") {
            add_oiling_app.title = "";
            show_message(
              add_oiling_app,
              "موفق",
              data.message,
              "success",
              5000
            );
            if (typeof oiling_maintenances_app != "undefined") {
              oiling_maintenances_app.oiling_maintenances.push(data.oiling_maintenance);
            }
          } else {
            show_message(
              add_oiling_app,
              "خطا",
              data.message,
              "danger",
              5000
            );
          }
        });
      },
    },
  });
</script>
