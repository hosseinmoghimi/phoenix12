<script>
    
    let oil_services_for_oil_services_app=JSON.parse("{{oil_services_s|escapejs}}")
    let oil_services_app = new Vue({
        el: "#oil-services-app",
        data: {
            oil_services: oil_services_for_oil_services_app
        },
        methods: {
            to_price: function(vall) { 
                return  to_price(vall) 
            },

            
            sum_oil: function() { 
                let s=0
                this.oil_services.forEach(oil_service => {
                    s+=oil_service.oil_liter
                });
                return s 
            },

            
            sum_cost: function() { 
                let s=0
                this.oil_services.forEach(oil_service => {
                    s+=oil_service.cost
                });
                return to_price(s) 
            },

        }
    })
</script>
