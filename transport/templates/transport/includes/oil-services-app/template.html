{% load static %}
<div id="accordion-oil-services" class="rtl text-right farsi">
  <div class="card" id="oil-services-app">
    <div class="card-header">
      <h5 class="text-center">
        <button
          class="btn btn-link"
          data-toggle="collapse"
          data-target="#collapse-oil-services"
          aria-expanded="true"
          aria-controls="collapse-oil-services"
        >
سرویس های روغن

<span v-if="oil_services.length>0">
            <small class="text-danger mx-2">
              <span v-text="oil_services.length"></span>
            </small>
          </span>
        </button>
      </h5>
    </div>

    <div
      id="collapse-oil-services"
      class="collapse {% if expand_oil_services %} show {% endif %}"
      aria-labelledby="heading-oil-services"
      data-parent="#accordion-oil-services"
    >
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <th>نوع روغن</th>
              <th>سرویس روغن</th>
              <th>لیتراژ روغن</th>
              <th>ساعت دستگاه</th>
              <th>برآورد هزینه</th>
              <th>توضیحات</th> 
            </thead>
            <tbody>
              <tr v-for="oil_service in oil_services">
                <td>
                 <div class="media">
                    <a :href="oil_service.get_absolute_url">
                      <img src="{% static 'transport/img/motor-oil.png' %}" width="32" class="rounded-circle" alt="">
                    </a>
                    <div class="media-body mr-2">
                      <a :href="oil_service.oil_type.get_absolute_url">
                        <span v-text="oil_service.oil_type"></span>
                    </a>
                </div>
            </div>
                </td>

                <td>
                  
                <h6 v-text="oil_service.oil_action"></h6>
                </td>


                
                <td>
                        <h6 v-text="oil_service.oil_liter"></h6>
                </td>
                   <td>
                     <div v-if="oil_service.vehicle_hour" >

                         <img src="{% static 'leo/img/timer.png' %}" width="28" alt="{{CURRENCY}}">   
                        <span v-text="to_price(oil_service.vehicle_hour)">
                            
                        </span>
                    </div>

                        <h6 v-text="oil_service.vehicle_hour"></h6>
                </td>

                
                   <td>
                     <div v-if="oil_service.cost" >

                         <img src="{% static 'leo/img/rial.png' %}" width="28" alt="{{CURRENCY}}">   
                        <span v-text="to_price(oil_service.cost)">
                            
                        </span>
                    </div>

                        
                </td>

                 <td>
                        <h6 v-text="oil_service.description"></h6>
                </td>



               
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
